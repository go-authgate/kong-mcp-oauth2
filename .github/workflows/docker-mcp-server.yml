name: Docker Image (mcp-server)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "mcp-server/**"
      - ".github/workflows/docker-mcp-server.yml"

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/mcp-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          platforms: linux/amd64
          file: ./mcp-server/Dockerfile
          push: false
          load: true
          tags: ${{ env.REPO }}/mcp-server:scan

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REPO }}/mcp-server:scan
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-docker-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-docker-results.sarif"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          platforms: linux/amd64,linux/arm64
          file: ./mcp-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO }}/mcp-server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO }}/mcp-server:buildcache,mode=max
