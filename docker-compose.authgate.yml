# DB-less Kong wired to a real Signet on the host at http://localhost:8080
# (via kong.authgate.yml). Instead of building the plugin inside Docker (see
# docker-compose.yml / Dockerfile), it mounts a locally cross-compiled binary
# into the stock kong:3.9 image — handy when a TLS-intercepting proxy blocks the
# in-Docker `go mod download`. Build the binary first:
#
#   CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o mcp-oauth2-linux .
#   docker-compose -f docker-compose.authgate.yml up -d
#
# (GOARCH=amd64 on Intel Macs / x86_64 Docker VMs.)
services:
  kong:
    image: kong:3.9
    ports:
      - "8000:8000" # proxy (MCP traffic enters here)
    depends_on:
      - mcp-server
      - mcp-sentry
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      # The admin API is unauthenticated and can replace the whole gateway
      # config (POST /config) even DB-less, so bind it to the container's
      # loopback only: unreachable from the sibling MCP upstream containers and
      # not published to the host. Reach it for debugging via
      # `docker exec <kong container> curl http://127.0.0.1:8001/...`.
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"

      # Set log level to info so plugin diagnostics (rejected token, non-access
      # token, control chars) are visible — Kong's default "notice" suppresses them.
      KONG_LOG_LEVEL: "info"

      # Register the Go plugin and wire the pluginserver to its binary.
      KONG_PLUGINS: "bundled,mcp-oauth2"
      KONG_PLUGINSERVER_NAMES: "mcp-oauth2"
      KONG_PLUGINSERVER_MCP_OAUTH2_START_CMD: "/usr/local/bin/mcp-oauth2"
      KONG_PLUGINSERVER_MCP_OAUTH2_QUERY_CMD: "/usr/local/bin/mcp-oauth2 -dump"
    extra_hosts:
      # Lets the plugin reach Signet running on the macOS host at
      # host.docker.internal:8080 (jwks_uri in kong.authgate.yml).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kong.authgate.yml:/kong/kong.yml:ro
      - ./mcp-oauth2-linux:/usr/local/bin/mcp-oauth2:ro

  # Real MCP servers: each echoes Kong's trusted X-MCP-Subject / X-MCP-Scope
  # headers back through a `whoami` tool. Same image backs both routes; only the
  # advertised server name differs (MCP_SERVER_NAME) — the per-call sub/scope
  # comes from Kong's per-route headers. Both listen on :3000 to match the
  # upstreams in kong.authgate.yml.
  mcp-server:
    build: ./mcp-server
    environment:
      MCP_SERVER_NAME: mcp-server
  mcp-sentry:
    build: ./mcp-server
    environment:
      MCP_SERVER_NAME: mcp-sentry
