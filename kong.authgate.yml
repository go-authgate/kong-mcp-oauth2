# Local config wired to a REAL Signet running on the macOS host at
# http://localhost:8080. Use with docker-compose.authgate.yml. The end-to-end
# hands-on walkthrough is HANDS-ON.zh-TW.md; kong.yml holds the production
# placeholder form.
#
# The localhost-vs-container split (the one gotcha plain HTTP doesn't remove):
#   - issuer:  matches the token's `iss` claim byte-for-byte. Signet's
#     discovery reports issuer "http://localhost:8080", so that's the value.
#   - jwks_uri: fetched BY KONG (inside the container), so it must be a host
#     address the container can reach — host.docker.internal:8080, NOT
#     localhost:8080 (which, inside the container, is the container itself).
#   - gateway_origin: the externally reachable Kong proxy, unchanged.
_format_version: "3.0"

services:
  # gitea route — frictionless: no scope requirement, so ANY valid Signet
  # access token is forwarded. Signet's scopes_supported is only
  # `openid profile email` (no `mcp:gitea`), so leaving required_scopes here
  # avoids a guaranteed 403. Register `mcp:gitea` on Signet and add it back
  # to enforce it.
  - name: mcp-server
    url: http://mcp-server:3000
    routes:
      - name: mcp-server
        paths:
          - /mcp/server
          - /.well-known/oauth-protected-resource/mcp/server
        strip_path: true
    plugins:
      - name: mcp-oauth2
        config:
          issuer: http://localhost:8080
          gateway_origin: http://localhost:8000
          resource_path: /mcp/server
          jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
          required_scopes:
            - mcp:gitea
          # aud enforced by default: tokens must carry
          # aud == http://localhost:8000/mcp/server.
          # Mint them with RFC 8707 resource binding (HANDS-ON.zh-TW.md §6 / §9):
          #   1) add http://localhost:8000/mcp/server to the client's
          #      allowed_resources in Signet (empty allowlist = deny-all), and
          #   2) send resource=http://localhost:8000/mcp/server on /oauth/token.
          # A token minted without it gets 401 invalid_token here.
          leeway_seconds: 60

  # sentry route — demonstrates scope enforcement using `email`, a scope
  # Signet actually issues. A token requested with `--scope "email"` passes;
  # one without it gets 403 insufficient_scope.
  - name: mcp-sentry
    url: http://mcp-sentry:3000
    routes:
      - name: mcp-sentry
        paths:
          - /mcp/sentry
          - /.well-known/oauth-protected-resource/mcp/sentry
        strip_path: true
    plugins:
      - name: mcp-oauth2
        config:
          issuer: http://localhost:8080
          gateway_origin: http://localhost:8000
          resource_path: /mcp/sentry
          jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
          required_scopes:
            - email
          # aud enforced by default — same as mcp-server: bind via
          # resource=http://localhost:8000/mcp/sentry
          leeway_seconds: 60

  - name: mcp-gitea
    url: http://host.docker.internal:8081/mcp
    routes:
      - name: mcp-gitea
        paths:
          - /mcp/gitea
          - /.well-known/oauth-protected-resource/mcp/gitea
        strip_path: true
    plugins:
      - name: mcp-oauth2
        config:
          issuer: http://localhost:3000
          gateway_origin: http://localhost:8000
          resource_path: /mcp/gitea
          jwks_uri: http://host.docker.internal:3000/login/oauth/keys
          # Gitea's access token carries NO `scope` claim, so any required_scopes
          # here is an automatic 403 (the plugin can't find scopes it grants).
          # Leave it unset to forward ANY valid Gitea token; enable debug_claims
          # (below) to confirm which claims the token actually carries. If Gitea
          # later starts emitting a scope claim, add the scopes back to enforce.
          required_scopes: []
          # Gitea's tokens carry no per-resource aud, so the default aud check
          # (aud == http://localhost:8000/mcp/gitea) would 401 every request.
          # Skipped here like the other Gitea-shaped claims below — this demo
          # route accepts any valid Gitea token, replayable across siblings.
          skip_audience_check: true
          leeway_seconds: 60
          skip_issuer_check: true
          skip_type_check: true
          skip_control_chars: true
          # dump decoded claims to the debug log (needs KONG_LOG_LEVEL=debug);
          # off by default elsewhere — enable only while diagnosing 401/403.
          debug_claims: true
